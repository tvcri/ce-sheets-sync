<svg width="1024" viewBox="0 0 1024 580" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>CE Sheets Sync data flow diagram</title>
  <desc>Club Express sends an automated CSV report to an IMAP email inbox. sync.js polls the inbox, retrieves the CSV, parses and transforms the data, then writes to 14 Google Sheets via the Google Sheets API — one per TVCRI metro area.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Club Express -->
  <rect x="200" y="40" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Club Express</text>
  <text x="340" y="81" text-anchor="middle" font-size="12" fill="#993C1D">Sends automated CSV report</text>

  <!-- Arrow CE -> IMAP -->
  <line x1="340" y1="96" x2="340" y2="134" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="119" font-size="12" fill="#888780">email</text>

  <!-- IMAP mailbox -->
  <rect x="200" y="134" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="157" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">IMAP mailbox</text>
  <text x="340" y="175" text-anchor="middle" font-size="12" fill="#185FA5">Receives report as email attachment</text>

  <!-- Arrow IMAP -> sync.js -->
  <line x1="340" y1="190" x2="340" y2="228" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="213" font-size="12" fill="#888780">poll</text>

  <!-- sync.js -->
  <rect x="200" y="228" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="251" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">sync.js</text>
  <text x="340" y="269" text-anchor="middle" font-size="12" fill="#534AB7">Parse CSV · transform · write</text>

  <!-- Trunk line down -->
  <line x1="340" y1="284" x2="340" y2="324" stroke="#B4B2A9" stroke-width="1"/>
  <text x="356" y="308" font-size="12" fill="#888780">Google Sheets API</text>

  <!-- Distributor bar -->
  <line x1="88" y1="324" x2="592" y2="324" stroke="#B4B2A9" stroke-width="1"/>

  <!-- Drop lines row 1 -->
  <line x1="88"  y1="324" x2="88"  y2="334" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="172" y1="324" x2="172" y2="334" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="256" y1="324" x2="256" y2="334" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="340" y1="324" x2="340" y2="334" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="424" y1="324" x2="424" y2="334" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="508" y1="324" x2="508" y2="334" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="592" y1="324" x2="592" y2="334" stroke="#B4B2A9" stroke-width="0.8"/>

  <!-- Drop lines row 2 -->
  <line x1="88"  y1="324" x2="88"  y2="414" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="172" y1="324" x2="172" y2="414" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="256" y1="324" x2="256" y2="414" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="340" y1="324" x2="340" y2="414" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="424" y1="324" x2="424" y2="414" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="508" y1="324" x2="508" y2="414" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="592" y1="324" x2="592" y2="414" stroke="#B4B2A9" stroke-width="0.8"/>

  <!-- Row 1: 7 metro sheets -->
  <rect x="52"  y="334" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="88"  y="360" text-anchor="middle" font-size="11" fill="#085041">Aquidneck</text>

  <rect x="136" y="334" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="172" y="360" text-anchor="middle" font-size="11" fill="#085041">Barrington</text>

  <rect x="220" y="334" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="256" y="360" text-anchor="middle" font-size="11" fill="#085041">Bris-Warren</text>

  <rect x="304" y="334" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="360" text-anchor="middle" font-size="11" fill="#085041">Burrillville</text>

  <rect x="388" y="334" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="424" y="360" text-anchor="middle" font-size="11" fill="#085041">Cumberland</text>

  <rect x="472" y="334" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="508" y="360" text-anchor="middle" font-size="11" fill="#085041">E. Greenwich</text>

  <rect x="556" y="334" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="592" y="360" text-anchor="middle" font-size="11" fill="#085041">Edgewood</text>

  <!-- Row 2: 7 more -->
  <rect x="52"  y="414" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="88"  y="440" text-anchor="middle" font-size="11" fill="#085041">Glocester</text>

  <rect x="136" y="414" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="172" y="440" text-anchor="middle" font-size="11" fill="#085041">Jamestown</text>

  <rect x="220" y="414" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="256" y="440" text-anchor="middle" font-size="11" fill="#085041">Providence</text>

  <rect x="304" y="414" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="440" text-anchor="middle" font-size="11" fill="#085041">TVC</text>

  <rect x="388" y="414" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="424" y="440" text-anchor="middle" font-size="11" fill="#085041">Warwick</text>

  <rect x="472" y="414" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="508" y="440" text-anchor="middle" font-size="11" fill="#085041">Westerly</text>

  <rect x="556" y="414" width="72" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="592" y="440" text-anchor="middle" font-size="11" fill="#085041">Wood River</text>

  <!-- Footer -->
  <text x="340" y="478" text-anchor="middle" font-size="12" fill="#888780">14 Google Sheets — one per metro area</text>
  <text x="340" y="498" text-anchor="middle" font-size="11" fill="#B4B2A9">Each sheet: Members · Volunteers · Requests Open · Confirmed · History · Metadata</text>
</svg>
